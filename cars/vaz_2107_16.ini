# ВАЗ-21074 1.6i (2010 г.в., МКПП-5)
# Профиль автомобиля для telemetry_analyzer.py / telemetry_app.py.
# Файл должен быть сохранен в кодировке UTF-8.

[car]
name = ВАЗ-2107 1.6 (2010 г.в., МКПП)

# Снаряженная масса ~1060 кг + водитель ~80 кг + топливо ~30 кг
mass = 1170

# Аэродинамическое сопротивление: Cd ~0.48 * площадь лобового сечения A ~1.88 м²
cd_a = 0.90

# Коэффициент сопротивления качению шин (для асфальта стандартно 0.010-0.015)
crr = 0.012

# Радиус качения колеса в метрах (штатные шины 175/70 R13 ~ 0.275 м)
r_wheel = 0.275

# КПД трансмиссии долей: 0.88 = 88% (задний привод с карданом и мостом — ниже, чем у переднеприводных)
efficiency = 0.88

# Общее передаточное число (КПП * главная пара).
# Штатно: 5-ступ. КПП (1-я 3.667, 2-я 2.100, 3-я 1.361, 4-я 1.000, 5-я 0.819), главная пара 4.1
# 3-я передача: 1.361 * 4.1 ≈ 5.58
# Другие варианты: 2-я 2.100*4.1=8.61 | 4-я 1.000*4.1=4.10 | с ГП 4.3: 3-я = 5.85
# 0 = график момента двигателя не строится
gear_ratio = 5.58
