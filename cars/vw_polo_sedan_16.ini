# VW Polo Sedan 1.6 (2017 г.в., МКПП)
# Профиль автомобиля для telemetry_analyzer.py / telemetry_app.py.
# Файл должен быть сохранен в кодировке UTF-8.

[car]
name = VW Polo Sedan 1.6 (2017, МКПП)

# Масса автомобиля в кг (снаряженная + водитель + топливо)
mass = 1250

# Аэродинамическое сопротивление: коэффициент Cd * площадь лобового сечения A, м²
cd_a = 0.65

# Коэффициент сопротивления качению шин (для асфальта стандартно 0.010-0.015)
crr = 0.012

# Радиус качения колеса в метрах (185/60 R15 ~ 0.288 м)
r_wheel = 0.288

# КПД трансмиссии долей: 0.90 = 90%
efficiency = 0.90

# Общее передаточное число (КПП * главная пара). 3-я передача: 1.229 * 4.064 ≈ 5.0
# 0 = график момента двигателя не строится
gear_ratio = 5.0
