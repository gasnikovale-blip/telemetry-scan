# ============================================================
# ШАБЛОН ПРОФИЛЯ АВТОМОБИЛЯ
# ============================================================
# Как создать профиль своего автомобиля:
#   1. Скопируйте этот файл в этой же папке (cars/).
#   2. Переименуйте, например: cars/lada_granta.ini
#      (имя файла без пробелов — оно используется в аргументе --car).
#   3. Заполните значения ниже.
#
# Кодировка файла: UTF-8.
# Комментарии: строка целиком или после значения через ';' или '#'.
# Имена ключей пишутся в нижнем регистре.
#
# Файлы, начинающиеся с '_' или '.', в список профилей не попадают —
# поэтому этот шаблон не отображается в программе.
# ============================================================

[car]
# Отображаемое имя автомобиля (для GUI и PDF-отчета)
name = Мой автомобиль

# Масса автомобиля в кг (снаряженная + водитель + топливо)
mass = 1200

# Аэродинамическое сопротивление: коэффициент Cd * площадь лобового сечения A, м²
# Типичные значения: седан ~0.65, хэтчбек ~0.70, внедорожник ~0.90
cd_a = 0.65

# Коэффициент сопротивления качению шин
# Для асфальта стандартно 0.010-0.015
crr = 0.012

# Радиус качения колеса в метрах.
# Примеры: 185/60 R15 ~ 0.288 м, 195/65 R15 ~ 0.301 м, 205/55 R16 ~ 0.316 м
r_wheel = 0.30

# КПД трансмиссии долей: 0.90 = 90% (используется для расчета мощности и момента двигателя)
efficiency = 0.90

# Общее передаточное число передачи (КПП * главная пара), на которой вы едете
# большую часть круга. Пример: 3-я передача 1.229 * главная пара 4.064 ≈ 5.0
# 0 = график момента двигателя не строится
gear_ratio = 0
